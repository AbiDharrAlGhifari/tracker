:root{
  --bg:#F1F2F6;
  --surface:#FFFFFF;
  --field:#EEF0F5;
  --ink:#14161B;
  --ink-muted:#71737F;
  --brand:#5457E5;
  --brand-tint:#ECEBFC;
  --success:#0FA084;
  --success-tint:#DFF3EE;
  --track:#E5E6ED;
  --glow1:rgba(84,87,229,0.10);
  --glow2:rgba(15,160,132,0.06);
}
html[data-theme="dark"]{
  --bg:#15161C;
  --surface:#1E2028;
  --field:#262832;
  --ink:#F2F3F7;
  --ink-muted:#8E909C;
  --brand:#7477F5;
  --brand-tint:rgba(116,119,245,0.16);
  --success:#1DC3A3;
  --success-tint:rgba(29,195,163,0.18);
  --track:#33353F;
  --glow1:rgba(116,119,245,0.14);
  --glow2:rgba(29,195,163,0.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  background:
    radial-gradient(1000px 480px at 50% -8%, var(--glow1), transparent 60%),
    radial-gradient(700px 380px at 90% 6%, var(--glow2), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  min-height:100vh;
  transition:background .4s ease, color .4s ease;
}
.disp{font-family:'Alnaseeb','Segoe UI',sans-serif;font-weight:400;}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;}
}

.wrap{max-width:540px;margin:0 auto;padding:16px 14px 60px;}

/* Compact icon-only theme toggle, tucked into the hero row */
.theme-icon-btn{
  width:34px;height:34px;border-radius:50%;border:none;flex:none;cursor:pointer;
  background:var(--surface);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(20,22,27,.12),0 1px 1px rgba(20,22,27,.06);
  transition:background .3s,color .3s,transform .15s;
}
.theme-icon-btn:active{transform:scale(.92);}
.theme-icon-btn svg{width:16px;height:16px;}
.theme-icon-btn.is-dark{color:var(--success);}

/* Hero */
.hero{animation:heroIn .6s cubic-bezier(.16,1,.3,1);margin-bottom:4px;}
@keyframes heroIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.hero-text{min-width:0;flex:1;}
.hero-title{font-size:22px;line-height:1.3;margin:0;}
.hero-sub{font-size:11.5px;color:var(--ink-muted);margin-top:4px;}
.hero-ring-row{display:flex;align-items:center;gap:10px;flex:none;}
.ring-wrap{position:relative;flex:none;}
.ring-wrap .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--brand);}

/* Setup screen (only used if list is ever reset) */
.setup{padding-top:6px;}
.setup .hero-title{text-align:center;}
.setup .hero-sub{text-align:center;max-width:400px;margin-left:auto;margin-right:auto;}
.field-group{margin-top:16px;}
.field-label{display:block;font-size:11.5px;color:var(--ink-muted);font-weight:600;margin:0 0 7px;}
.field{
  width:100%;background:var(--field);border:1.5px solid transparent;border-radius:16px;
  padding:13px 15px;font-size:13.5px;color:var(--ink);transition:border-color .2s,background .2s,box-shadow .2s;
  font-family:inherit;
}
.field:focus{outline:none;background:var(--surface);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint);}
textarea.field{resize:vertical;}
#linksInput{min-height:115px;direction:ltr;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;}
#msgInput{min-height:170px;direction:rtl;text-align:right;line-height:1.7;}
.names-row{display:flex;gap:10px;}
.names-row .field{flex:1;min-width:0;}
.btn-primary{
  margin-top:18px;width:100%;background:var(--brand);color:#fff;border:none;border-radius:16px;
  padding:15px 20px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;
  box-shadow:0 14px 28px -14px rgba(84,87,229,.65);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn-primary:active{transform:scale(.97);box-shadow:0 6px 14px -8px rgba(84,87,229,.55);}
.err-text{color:#E5675E;font-size:12px;margin-top:8px;min-height:16px;font-weight:600;}

.hint-text{font-size:10.5px;color:var(--ink-muted);text-align:center;line-height:1.6;margin:10px auto 16px;max-width:380px;}

/* Two-column split */
.sections-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}

.section-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-bottom:9px;}
.section-head .ring-wrap{width:36px;height:36px;}
.section-head .ring-num{font-size:9px;}
.section-head .name{font-size:13px;line-height:1.3;}
.section-head .name-sub{font-size:9px;color:var(--ink-muted);}
.remaining-chip{background:var(--brand-tint);color:var(--brand);font-size:9px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}

/* Message card with liquid-fill progress */
.msg-card{
  position:relative;overflow:hidden;border-radius:15px;margin-bottom:8px;
  background:var(--surface);
  box-shadow:0 1px 2px rgba(20,22,27,.04),0 10px 22px -18px rgba(20,22,27,.35);
}
.fill{
  position:absolute;left:0;right:0;bottom:0;height:0%;
  background:var(--success-tint);
  transition:height .45s cubic-bezier(.4,0,.2,1);
  z-index:0;
}
.fill::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--success);opacity:.55;}
.msg-card.st-sent .fill{height:50%;}
.msg-card.st-done .fill{height:100%;background:var(--success-tint);}
.done-badge{
  position:absolute;top:7px;left:7px;width:18px;height:18px;border-radius:50%;
  background:var(--success);color:#fff;display:none;align-items:center;justify-content:center;z-index:2;
}
.done-badge svg{width:10px;height:10px;}
.msg-card.st-done .done-badge{display:flex;}

.card-content{position:relative;z-index:1;padding:9px;}
.card-top{display:flex;align-items:center;gap:5px;}
.idx-badge{
  width:19px;height:19px;border-radius:6px;background:var(--brand-tint);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;flex:none;
}
.name-input{
  flex:1;min-width:0;background:var(--field);border:1.3px solid transparent;border-radius:8px;
  padding:5px 7px;font-size:10.5px;color:var(--ink);font-family:inherit;transition:border-color .2s,box-shadow .2s;
}
.name-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint);}
.name-input::placeholder{color:var(--ink-muted);}
.copy-icon-btn{
  width:24px;height:24px;border-radius:7px;border:none;background:var(--field);color:var(--ink-muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .2s,color .2s,transform .1s;
}
.copy-icon-btn:active{transform:scale(.9);}
.copy-icon-btn.copied{background:var(--brand);color:#fff;}
.copy-icon-btn svg{width:12px;height:12px;}
.link-text{display:block;font-size:8.5px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left;text-decoration:none;margin:6px 0 0 2px;}
.ts-text{display:block;font-size:8px;color:var(--success);font-weight:700;margin-top:2px;}

.action-row{display:flex;flex-direction:column;gap:5px;margin-top:7px;}
.pill-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:4px;
  padding:7px 5px;border-radius:9px;font-size:9.5px;font-weight:700;border:none;cursor:pointer;
  font-family:inherit;transition:background .2s,color .2s,box-shadow .2s,transform .1s;
  white-space:normal;line-height:1.25;text-align:center;
}
.pill-btn svg{width:11px;height:11px;flex:none;}
.pill-btn:active{transform:scale(.96);}
.pill-btn.sent{background:var(--field);color:var(--ink-muted);}
.pill-btn.sent.on{background:var(--success-tint);color:var(--success);}
.pill-btn.done{background:var(--field);color:var(--ink-muted);}
.pill-btn.done.on{background:var(--success);color:#fff;box-shadow:0 8px 16px -10px rgba(15,160,132,.65);}

.reset-row{text-align:center;margin-top:18px;}
.reset-row button{background:none;border:none;color:var(--ink-muted);font-size:11.5px;cursor:pointer;padding:8px;font-family:inherit;text-decoration:underline;text-underline-offset:3px;}

@media (max-width:360px){
  .wrap{padding:12px 8px 46px;}
  .hero-title{font-size:19px;}
  .sections-grid{gap:7px;}
  .card-content{padding:7px;}
  .pill-btn{font-size:9px;padding:6px 4px;}
}
</style>

function uid(){ return Math.random().toString(36).slice(2,9); }

function ring(pct, size, stroke){
  const r = (size - stroke)/2;
  const c = 2*Math.PI*r;
  const offset = c - (Math.max(0,Math.min(100,pct))/100)*c;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--brand)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)"/>
    </svg>
    <div class="ring-num">${Math.round(pct)}%</div>
  </div>`;
}

function applyTheme(){ document.documentElement.setAttribute('data-theme', theme); }

async function loadTheme(){
  try{
    const res = await window.storage.get(THEME_KEY, false);
    theme = (res && (res.value === 'dark' || res.value === 'light')) ? res.value : 'light';
  }catch(e){ theme = 'light'; }
  applyTheme();
}

async function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  render();
  try{ await window.storage.set(THEME_KEY, theme, false); }catch(e){}
}

async function saveState(){
  try{ await window.storage.set(KEY, JSON.stringify(state), true); }
  catch(e){ console.error('save failed', e); }
}

function parseLinks(raw){
  return raw.split(String.fromCharCode(10)).map(s=>s.trim()).filter(Boolean);
}

function buildState(links, nameA, nameB, msgTemplate){
  const half = Math.ceil(links.length/2);
  const items = links.map((url,i)=>({
    id: uid(), url, person: i < half ? 'A' : 'B',
    name: '', sent: false, sentAt: null, done: false, doneAt: null
  }));
  return {
    people: { A: nameA || 'الشخص الأول', B: nameB || 'الشخص الثاني' },
    msgTemplate: msgTemplate || DEFAULT_MSG,
    items
  };
}

function shortUrl(url){
  try{
    const u = new URL(url);
    const idParam = u.searchParams.get('uid') || u.searchParams.get('USER_ID') || u.searchParams.get('pst') || '';
    return u.hostname.replace('www.','') + (idParam ? ('  ·  ' + idParam.slice(0,8)) : '');
  }catch(e){ return url; }
}

function messageFor(url){
  const tpl = (state && state.msgTemplate) ? state.msgTemplate : DEFAULT_MSG;
  return tpl.split(PLACEHOLDER).join(url);
}

function copyText(text, btn, doneRestoreHtml){
  const done = ()=>{
    btn.innerHTML = ICON_CHECK;
    btn.classList.add('copied');
    setTimeout(()=>{ btn.innerHTML = doneRestoreHtml; btn.classList.remove('copied'); }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  done();
}

function themeToggleHtml(){
  const isDark = theme === 'dark';
  return `<button class="theme-icon-btn ${isDark?'is-dark':''}" id="themeBtn" aria-label="${isDark ? T.themeLight : T.themeDark}">${isDark ? ICON_MOON : ICON_SUN}</button>`;
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = ''; return; }
  if(!state){ renderSetup(app); } else { renderTracker(app); }
  const tb = document.getElementById('themeBtn');
  if(tb) tb.addEventListener('click', toggleTheme);
}

function renderSetup(app){
  app.innerHTML = `
    <div class="setup hero">
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">${themeToggleHtml()}</div>
      <h1 class="hero-title disp">${T.setupTitle}</h1>
      <p class="hero-sub">${T.setupDesc}</p>
      <div class="field-group">
        <label class="field-label">${T.linksLabel}</label>
        <textarea class="field" id="linksInput" placeholder="${T.linksPlaceholder}"></textarea>
      </div>
      <div class="field-group names-row">
        <input class="field" id="nameA" placeholder="${T.nameA}" />
        <input class="field" id="nameB" placeholder="${T.nameB}" />
      </div>
      <div class="field-group">
        <label class="field-label">${T.msgLabel}</label>
        <textarea class="field" id="msgInput">${DEFAULT_MSG}</textarea>
      </div>
      <button class="btn-primary" id="startBtn">${T.create}</button>
      <div class="err-text" id="setupErr"></div>
    </div>
  `;
  document.getElementById('startBtn').addEventListener('click', async ()=>{
    const raw = document.getElementById('linksInput').value;
    const links = parseLinks(raw);
    const errEl = document.getElementById('setupErr');
    if(links.length === 0){ errEl.textContent = T.errEmpty; return; }
    const nameA = document.getElementById('nameA').value.trim();
    const nameB = document.getElementById('nameB').value.trim();
    const msgTemplate = document.getElementById('msgInput').value;
    state = buildState(links, nameA, nameB, msgTemplate);
    await saveState();
    render();
  });
}

function weightedDone(items){
  return items.reduce((s,i)=> s + (i.done ? 1 : (i.sent ? 0.5 : 0)), 0);
}

function renderTracker(app){
  const total = state.items.length;
  const totalDone = state.items.filter(i=>i.done).length;
  const overallPct = total ? (weightedDone(state.items)/total*100) : 0;

  const sectionHtml = (p)=>{
    const items = state.items.filter(i=>i.person===p);
    const pTotal = items.length;
    const pDone = items.filter(i=>i.done).length;
    const pct = pTotal ? (weightedDone(items)/pTotal*100) : 0;
    const remaining = pTotal - pDone;
    const cards = items.map((it, idx)=>{
      const stCls = it.done ? 'st-done' : (it.sent ? 'st-sent' : '');
      return `
      <div class="msg-card ${stCls}" data-card="${it.id}">
        <div class="fill"></div>
        <div class="done-badge">${ICON_CHECK}</div>
        <div class="card-content">
          <div class="card-top">
            <div class="idx-badge">${idx+1}</div>
            <input class="name-input" data-name="${it.id}" placeholder="${T.namePlaceholder}" value="${(it.name||'').replace(/"/g,'&quot;')}" />
            <button class="copy-icon-btn" data-copy="${it.id}" aria-label="نسخ الرسالة">${ICON_COPY}</button>
          </div>
          <a class="link-text" href="${it.url}" target="_blank" rel="noopener">${shortUrl(it.url)}</a>
          <div class="action-row">
            <button class="pill-btn sent ${it.sent ? 'on' : ''}" data-sent="${it.id}">${ICON_CHECK}<span>${T.sentLbl}</span></button>
            <button class="pill-btn done ${it.done ? 'on' : ''}" data-done="${it.id}">${ICON_FORM}<span>${T.doneLbl}</span></button>
          </div>
        </div>
      </div>
    `;}).join('');
    return `
      <div class="section">
        <div class="section-head">
          ${ring(pct, 36, 4)}
          <div class="name disp">${state.people[p]}</div>
          <div class="name-sub">${pDone}/${pTotal}</div>
          <div class="remaining-chip">${T.remaining(remaining)}</div>
        </div>
        ${cards}
      </div>
    `;
  };

  app.innerHTML = `
    <div class="hero">
      <div class="hero-top">
        <div class="hero-text">
          <h1 class="hero-title disp">${T.title}</h1>
          <div class="hero-sub">${T.doneOf(totalDone, total)}</div>
        </div>
        <div class="hero-ring-row">
          ${ring(overallPct, 50, 6)}
          ${themeToggleHtml()}
        </div>
      </div>
    </div>
    <div class="hint-text">${T.hint}</div>
    <div class="sections-grid">
      ${sectionHtml('A')}
      ${sectionHtml('B')}
    </div>
    <div class="reset-row"><button id="resetBtn">${T.resetBtn}</button></div>
  `;

  app.querySelectorAll('[data-sent]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-sent');
      const item = state.items.find(i=>i.id===id);
      item.sent = !item.sent;
      item.sentAt = item.sent ? Date.now() : null;
      render();
      await saveState();
    });
  });

  app.querySelectorAll('[data-done]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-done');
      const item = state.items.find(i=>i.id===id);
      item.done = !item.done;
      item.doneAt = item.done ? Date.now() : null;
      render();
      await saveState();
    });
  });

  app.querySelectorAll('[data-copy]').forEach(btn=>{
    const original = btn.innerHTML;
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-copy');
      const item = state.items.find(i=>i.id===id);
      const text = messageFor(item.url);
      copyText(text, btn, original);
    });
  });

  app.querySelectorAll('[data-name]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const id = inp.getAttribute('data-name');
      const item = state.items.find(i=>i.id===id);
      item.name = inp.value;
    });
    inp.addEventListener('blur', async ()=>{ await saveState(); });
  });

  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(confirm(T.resetConfirm)){
      state = buildState(DEFAULT_LINKS, DEFAULT_NAME_A, DEFAULT_NAME_B, DEFAULT_MSG);
      await saveState();
      render();
    }
  });
  const tb2 = document.getElementById('themeBtn');
  if(tb2) tb2.addEventListener('click', toggleTheme);
}

async function init(){
  await loadTheme();
  try{
    const res = await window.storage.get(KEY, true);
    state = res ? JSON.parse(res.value) : null;
  }catch(e){ state = null; }
  if(!state){
    state = buildState(DEFAULT_LINKS, DEFAULT_NAME_A, DEFAULT_NAME_B, DEFAULT_MSG);
    await saveState();
  }
  loaded = true;
  render();
}
init();
</script>
</body>
</html>
